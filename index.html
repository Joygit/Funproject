<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day 🌹</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at top, #2b0a18, #060204);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* Cinematic vignette */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
  pointer-events: none;
}

/* Canvas */
canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* Scene */
.scene {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffe5ec;
  text-align: center;
}

/* Rose */
.rose {
  width: 170px;
  filter: drop-shadow(0 0 40px rgba(255,77,109,0.6));
  transition: transform 0.2s ease;
}

/* Ribbon wrap */
.ribbon-wrap {
  position: relative;
  width: 220px;
  height: 80px;
  margin-top: -20px;
}

.ribbon {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 32px;
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  border-radius: 20px;
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 1.6s ease;
}

/* Knot */
.knot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28px;
  height: 28px;
  background: radial-gradient(circle, #ffccd5, #c9184a);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  box-shadow: 0 0 20px rgba(255,77,109,0.8);
}

/* Knot animation */
.knot.tie {
  animation: tieKnot 1.4s ease forwards;
}

@keyframes tieKnot {
  0% {
    transform: translate(-50%, -50%) scale(0);
  }
  60% {
    transform: translate(-50%, -50%) scale(1.3);
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
  }
}

/* Text */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.4rem;
  margin-top: 30px;
  color: #ffb3c6;
  text-shadow: 0 0 25px rgba(255,77,109,0.7);
}

.question {
  font-size: 1.2rem;
  margin-top: 10px;
  opacity: 0.9;
}

/* Buttons */
.buttons {
  margin-top: 22px;
}

button {
  padding: 10px 26px;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
}

.accept {
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  color: white;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* Final cinematic overlay */
.final {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(15px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: 2.5s ease;
  z-index: 3;
  color: #7a102a;
}

.final.show {
  opacity: 1;
}

.final h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.2rem;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="scene">

  <!-- SVG Rose -->
  <svg class="rose" id="rose" viewBox="0 0 200 300">
    <circle cx="100" cy="90" r="42" fill="#c9184a"/>
    <circle cx="78" cy="80" r="36" fill="#ff4d6d"/>
    <circle cx="122" cy="80" r="36" fill="#ff4d6d"/>
    <rect x="95" y="120" width="10" height="150" fill="#2d6a4f"/>
    <ellipse cx="65" cy="170" rx="30" ry="12" fill="#40916c"/>
    <ellipse cx="135" cy="200" rx="30" ry="12" fill="#40916c"/>
  </svg>

  <!-- Ribbon -->
  <div class="ribbon-wrap">
    <div class="ribbon" id="ribbon"></div>
    <div class="knot" id="knot"></div>
  </div>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this bouquet? 💌</div>

  <div class="buttons">
    <button class="accept" onclick="acceptRose()">Yes 💖</button>
  </div>

</div>

<div class="final" id="final">
  <h2>Wrapped in love, just for you 🌹</h2>
  <p>Some moments deserve forever.</p>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_8bfae3e5c6.mp3">
</audio>

<script>
/* ===== Canvas petals with glow trails ===== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};

const petals = [];

class Petal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = Math.random() * 1 - 0.5;
    this.vy = Math.random() * 1.2 + 0.4;
    this.size = Math.random() * 6 + 6;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(255,77,109,0.8)';
    ctx.fillStyle = 'rgba(255,77,109,0.9)';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function animate() {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  petals.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.y > canvas.height) petals.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

setInterval(() => {
  petals.push(new Petal(canvas.width / 2, canvas.height / 2 - 120));
}, 550);

/* ===== Accept interaction ===== */
function acceptRose() {
  document.getElementById('ribbon').style.transform = 'scaleX(1)';
  document.getElementById('knot').classList.add('tie');
  document.getElementById('music').play();
  document.getElementById('final').classList.add('show');

  for (let i = 0; i < 60; i++) {
    petals.push(new Petal(
      canvas.width / 2 + Math.random() * 140 - 70,
      canvas.height / 2
    ));
  }
}

/* ===== Mobile gyroscope ===== */
const rose = document.getElementById('rose');
if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', e => {
    const x = e.gamma / 20;
    const y = e.beta / 20;
    rose.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
  });
}
</script>

</body>
</html>
