<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Rose Day</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at top, #2b0b16, #070204);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* Canvas for petals */
canvas {
  position: fixed;
  inset: 0;
}

/* Scene */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffdbe5;
  text-align: center;
}

/* Rose */
.rose {
  width: 260px;
  filter: drop-shadow(0 0 40px rgba(255,70,110,0.65));
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  50% { transform: scale(1.05); }
}

/* Text */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.6rem;
  margin: 18px 0 6px;
  color: #ffb3c6;
}

.question {
  font-size: 1.2rem;
  opacity: 0.9;
}

/* YES – NOT A BUTTON */
.yes {
  margin-top: 32px;
  font-family: 'Great Vibes', cursive;
  font-size: 2.8rem;
  color: rgba(255, 90, 120, 0.85);
  transition: 0.6s ease;
}

.yes:hover {
  cursor: pointer;
  letter-spacing: 2px;
  color: #ff4d6d;
  text-shadow: 0 0 30px rgba(255,90,130,0.9);
}

/* Poem on rose */
.poem {
  position: absolute;
  top: 42%;
  width: 80%;
  max-width: 650px;
  font-family: 'Great Vibes', cursive;
  font-size: 2.3rem;
  color: #8a0f2a;
  opacity: 0;
  pointer-events: none;
  transition: 2s ease;
  text-shadow: 0 0 22px rgba(255,120,150,0.6);
}

.poem.show {
  opacity: 1;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="scene">
  <!-- REALISTIC MULTI-LAYER ROSE -->
  <svg class="rose" viewBox="0 0 200 300">
    <defs>
      <radialGradient id="petalGrad" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#ff9fb5"/>
        <stop offset="100%" stop-color="#8b0026"/>
      </radialGradient>
    </defs>

    <!-- Stem -->
    <rect x="96" y="120" width="8" height="160" fill="#145a32"/>

    <!-- Leaves -->
    <path d="M65 200 C25 170,25 230,65 215" fill="#1e8449"/>
    <path d="M135 220 C175 200,175 260,135 240" fill="#1e8449"/>

    <!-- Outer petals -->
    <ellipse cx="100" cy="70" rx="60" ry="45" fill="url(#petalGrad)" opacity="0.85"/>
    <ellipse cx="85" cy="68" rx="52" ry="40" fill="url(#petalGrad)" opacity="0.9"/>
    <ellipse cx="115" cy="68" rx="52" ry="40" fill="url(#petalGrad)" opacity="0.9"/>

    <!-- Inner spiral -->
    <path d="M100 46
             C84 52,80 72,100 88
             C120 72,116 52,100 46Z"
          fill="#ff6f91"/>
  </svg>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this rose?</div>

  <!-- Choice -->
  <div class="yes" onclick="acceptYes()">Yes…</div>
</div>

<!-- Poem -->
<div class="poem" id="poem"></div>

<!-- Music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_8bfae3e5c6.mp3">
</audio>

<script>
/* Canvas setup */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let petals = [];
let tilt = 0;
let calm = false;

/* Petal physics */
class Petal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vy = Math.random() * 1.2 + 0.4;
    this.vx = Math.random() * 0.6 - 0.3;
    this.size = Math.random() * 10 + 10;
    this.rot = Math.random() * Math.PI;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowBlur = 25;
    ctx.shadowColor = "rgba(255,80,120,0.85)";
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  update() {
    this.y += calm ? this.vy * 0.4 : this.vy;
    this.x += (this.vx + tilt) * (calm ? 0.4 : 1);
    this.rot += 0.02;
  }
}

/* Gentle petal fall */
setInterval(() => {
  petals.push(new Petal(innerWidth / 2, innerHeight / 2 - 140));
}, 420);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.y > canvas.height) petals.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

/* Gyroscope */
window.addEventListener("deviceorientation", e => {
  tilt = e.gamma / 40;
});

/* Poetry logic */
const poemLines = [
  "I waited as a rose, silent and still…",
  "Until your yes taught me how to bloom.",
  "Every petal fell only to reach you,",
  "Now keep me — softly, forever."
];

let index = 0;

function acceptYes() {
  calm = true;
  document.getElementById("music").play();

  const poem = document.getElementById("poem");
  poem.classList.add("show");
  poem.innerHTML = "";

  const interval = setInterval(() => {
    if (index < poemLines.length) {
      poem.innerHTML += poemLines[index] + "<br>";
      index++;
    } else {
      clearInterval(interval);
    }
  }, 1600);
}
</script>

</body>
</html>
