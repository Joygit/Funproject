<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Rose Day ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: rgba(255, 0, 80, 0.5);
  animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1.2);
    opacity: 0;
  }
}

/* Main card */
.card {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: pop 1.5s ease;
  max-width: 350px;
}

@keyframes pop {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #c9184a;
  animation: heartbeat 2s infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

p {
  margin-top: 15px;
  font-size: 1.1rem;
  color: #5a0f2e;
}

.rose {
  font-size: 4rem;
  margin: 20px 0;
  animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
  100% { transform: rotate(0deg); }
}

button {
  margin-top: 25px;
  padding: 12px 25px;
  font-size: 1rem;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  color: white;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  transition: transform 0.3s;
}

button:hover {
  transform: scale(1.1);
}

.hidden-msg {
  margin-top: 20px;
  font-size: 1.2rem;
  color: #800f2f;
  display: none;
  animation: fadeIn 1.5s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">
  <h1>Happy Rose Day</h1>
  <div class="rose">🌹</div>
  <p>A rose for the one who makes life beautiful 💖</p>
  <button onclick="showMessage()">For You</button>
  <div class="hidden-msg" id="msg">
    You are the reason every day feels special 🌸<br/>
    Keep smiling ❤️
  </div>
</div>

<script>
// Floating hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '❤️';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 15 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 5 + 's';
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 8000);
}

setInterval(createHeart, 300);

function showMessage() {
  document.getElementById('msg').style.display = 'block';
}
</script>

</body>
</html>
