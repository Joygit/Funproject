<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Hurts 🌹</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #2a0a1f, #0f0610);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  color: white;
}

/* Stage */
.stage {
  position: relative;
  width: 360px;
  height: 500px;
  perspective: 1000px;
}

/* Hand */
.hand {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(200px);
  font-size: 120px;
  animation: handIn 2s ease forwards;
}

@keyframes handIn {
  to { transform: translateX(-50%) translateY(0); }
}

/* Rose */
.rose {
  position: absolute;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  font-size: 70px;
  animation: pickRose 2s ease forwards;
  animation-delay: 1.8s;
}

@keyframes pickRose {
  to { transform: translateX(-50%) scale(1); }
}

/* Prick effect */
.prick {
  position: absolute;
  bottom: 210px;
  left: 53%;
  width: 12px;
  height: 12px;
  background: crimson;
  border-radius: 50%;
  opacity: 0;
  animation: prick 1s ease forwards;
  animation-delay: 3.8s;
}

@keyframes prick {
  0% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1.3); }
  100% { opacity: 0; transform: scale(0); }
}

/* Shake */
.shake {
  animation: shake 0.4s ease-in-out;
  animation-delay: 3.8s;
}

@keyframes shake {
  0% { transform: translateX(-50%) rotate(0deg); }
  25% { transform: translateX(-52%) rotate(-5deg); }
  50% { transform: translateX(-48%) rotate(5deg); }
  100% { transform: translateX(-50%) rotate(0deg); }
}

/* Bandage */
.bandage {
  position: absolute;
  bottom: 190px;
  left: 48%;
  font-size: 40px;
  opacity: 0;
  animation: wrap 2s ease forwards;
  animation-delay: 5s;
}

@keyframes wrap {
  to { opacity: 1; }
}

/* Offer rose */
.offer {
  animation: offer 2s ease forwards;
  animation-delay: 7s;
}

@keyframes offer {
  to { transform: translateX(-50%) translateY(-60px) scale(1.1); }
}

/* Message */
.message {
  position: absolute;
  top: 40px;
  width: 100%;
  text-align: center;
  opacity: 0;
  animation: textIn 2s ease forwards;
  animation-delay: 9s;
}

.message h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 2.6rem;
  color: #ffb3c6;
}

.message p {
  margin-top: 10px;
  font-size: 1rem;
  color: #ffe5ec;
}

@keyframes textIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="stage">
  <div class="message">
    <h1>Some love hurts…</h1>
    <p>But it is still worth giving 🌹</p>
  </div>

  <div class="hand shake offer">✋</div>
  <div class="rose offer">🌹</div>
  <div class="prick"></div>
  <div class="bandage">🤍</div>
</div>

</body>
</html>
