<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Day</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fff5f8, #ffe4ec);
  overflow: hidden;
}

/* Pages */
.page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1s ease, transform 1s ease;
}

/* First page */
#page1 {
  opacity: 1;
}

#page1.hide {
  opacity: 0;
  transform: translateY(-40px);
  pointer-events: none;
}

/* Second page */
#page2 {
  opacity: 0;
  pointer-events: none;
}

#page2.show {
  opacity: 1;
  pointer-events: auto;
}

/* Rose */
.rose {
  width: 180px;
  margin-bottom: 20px;
}

/* Text */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.2rem;
  color: #d6336c;
  margin: 10px 0;
}

.question {
  font-size: 1.2rem;
  color: #555;
}

/* YES text */
.yes {
  margin-top: 30px;
  font-family: 'Great Vibes', cursive;
  font-size: 2.5rem;
  color: #e64980;
  transition: 0.4s ease;
}

.yes:hover {
  cursor: pointer;
  letter-spacing: 2px;
  color: #c2255c;
}

/* Poetry */
.poetry {
  font-family: 'Great Vibes', cursive;
  font-size: 2.4rem;
  color: #c2255c;
  text-align: center;
  line-height: 1.6;
  padding: 20px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.poetry.show {
  opacity: 1;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <!-- Simple Elegant Rose -->
  <svg class="rose" viewBox="0 0 200 300">
    <defs>
      <radialGradient id="petal" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#ffccd5"/>
        <stop offset="100%" stop-color="#e64980"/>
      </radialGradient>
    </defs>

    <!-- Stem -->
    <rect x="96" y="120" width="8" height="160" fill="#3a7d44"/>

    <!-- Leaves -->
    <ellipse cx="70" cy="200" rx="30" ry="15" fill="#52b788" transform="rotate(-20 70 200)"/>
    <ellipse cx="130" cy="230" rx="30" ry="15" fill="#52b788" transform="rotate(20 130 230)"/>

    <!-- Petals -->
    <ellipse cx="100" cy="70" rx="55" ry="40" fill="url(#petal)"/>
    <ellipse cx="85" cy="70" rx="45" ry="35" fill="url(#petal)"/>
    <ellipse cx="115" cy="70" rx="45" ry="35" fill="url(#petal)"/>

    <!-- Inner -->
    <path d="M100 50
             C85 55,85 75,100 85
             C115 75,115 55,100 50Z"
          fill="#ff8fab"/>
  </svg>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this rose?</div>

  <div class="yes" onclick="goNext()">Yes…</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div class="poetry" id="poetry"></div>
</div>

<script>
const poemLines = [
  "I placed a rose in your hands today,",
  "Not just a flower, but a feeling.",
  "If love had a shape, it would be this moment,",
  "Quiet, soft… and choosing each other."
];

let line = 0;

function goNext() {
  document.getElementById("page1").classList.add("hide");
  document.getElementById("page2").classList.add("show");

  const poetry = document.getElementById("poetry");
  poetry.classList.add("show");

  const interval = setInterval(() => {
    if (line < poemLines.length) {
      poetry.innerHTML += poemLines[line] + "<br>";
      line++;
    } else {
      clearInterval(interval);
    }
  }, 1600);
}
</script>

</body>
</html>
