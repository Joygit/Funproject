<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Day</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at top, #2b0b16, #070204);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* Canvas */
canvas {
  position: fixed;
  inset: 0;
}

/* Scene */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffdbe5;
  text-align: center;
}

/* Realistic Rose */
.rose {
  width: 260px;
  filter: drop-shadow(0 0 35px rgba(255,70,110,0.6));
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  50% { transform: scale(1.05); }
}

/* Text */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.6rem;
  color: #ffb3c6;
  margin: 20px 0 10px;
}

.question {
  font-size: 1.2rem;
  opacity: 0.9;
}

/* YES AS EMOTION, NOT BUTTON */
.yes {
  margin-top: 30px;
  font-family: 'Great Vibes', cursive;
  font-size: 2.6rem;
  color: #ff4d6d;
  cursor: pointer;
  position: relative;
  transition: 0.4s ease;
}

.yes:hover {
  text-shadow: 0 0 20px rgba(255,90,130,0.9);
  transform: scale(1.1);
}

/* Final */
.final {
  position: fixed;
  inset: 0;
  background: rgba(255,240,245,0.9);
  backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transition: 2s;
}

.final.show {
  opacity: 1;
}

.final h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.4rem;
  color: #8a0f2a;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="scene">
  <!-- REALISTIC MULTI-PETAL ROSE -->
  <svg class="rose" viewBox="0 0 200 300">
    <defs>
      <radialGradient id="petal" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#ff9fb5"/>
        <stop offset="100%" stop-color="#9b002c"/>
      </radialGradient>
    </defs>

    <!-- Stem -->
    <rect x="96" y="120" width="8" height="160" fill="#145a32"/>

    <!-- Leaves -->
    <path d="M70 200 C30 170,30 230,70 215" fill="#1e8449"/>
    <path d="M130 220 C170 200,170 260,130 240" fill="#1e8449"/>

    <!-- Outer petals -->
    <ellipse cx="100" cy="70" rx="60" ry="45" fill="url(#petal)" opacity="0.85"/>
    <ellipse cx="85" cy="65" rx="50" ry="40" fill="url(#petal)" opacity="0.9"/>
    <ellipse cx="115" cy="65" rx="50" ry="40" fill="url(#petal)" opacity="0.9"/>

    <!-- Inner spiral -->
    <path d="M100 45
             C85 50,80 70,100 85
             C120 70,115 50,100 45Z"
          fill="#ff6f91"/>
  </svg>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this rose?</div>

  <div class="yes" onclick="accept()">Yes…</div>
</div>

<div class="final" id="final">
  <h1>This rose is yours 🌹</h1>
  <p>Forever, gently falling in love.</p>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_8bfae3e5c6.mp3">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let petals = [];
let tilt = 0;

/* Petal matches rose shape */
class Petal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vy = Math.random() * 1.2 + 0.4;
    this.vx = Math.random() * 0.6 - 0.3;
    this.size = Math.random() * 10 + 10;
    this.rot = Math.random() * Math.PI;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowBlur = 25;
    ctx.shadowColor = "rgba(255,80,120,0.8)";
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  update() {
    this.y += this.vy;
    this.x += this.vx + tilt;
    this.rot += 0.02;
  }
}

setInterval(() => {
  petals.push(new Petal(innerWidth / 2, innerHeight / 2 - 130));
}, 400);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.y > canvas.height) petals.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

/* Gyro */
window.addEventListener("deviceorientation", e => {
  tilt = e.gamma / 40;
});

function accept() {
  document.getElementById("final").classList.add("show");
  document.getElementById("music").play();
  for (let i = 0; i < 40; i++) {
    petals.push(new Petal(innerWidth / 2, innerHeight / 2));
  }
}
</script>

</body>
</html>
