<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Day 🌹</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: radial-gradient(circle at top, #2a0a16, #050103);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* Cinematic lighting */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,80,120,0.15), transparent 60%);
  pointer-events: none;
}

/* Canvas */
canvas {
  position: absolute;
  inset: 0;
}

/* Center scene */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffdbe5;
  text-align: center;
  pointer-events: none;
}

/* Rose SVG */
.rose {
  width: 220px;
  filter: drop-shadow(0 0 25px rgba(255,60,100,0.6));
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* Ribbon */
.ribbon {
  width: 260px;
  height: 120px;
  margin-top: -20px;
}

.knot {
  transform-origin: center;
  animation: knotTie 3s ease-in-out infinite alternate;
}

@keyframes knotTie {
  0% { transform: rotate(0deg) scale(1); }
  100% { transform: rotate(4deg) scale(1.05); }
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.4rem;
  margin-top: 20px;
  color: #ffb3c6;
}

.question {
  margin-top: 10px;
  font-size: 1.2rem;
}

.buttons {
  margin-top: 20px;
  pointer-events: auto;
}

button {
  padding: 12px 26px;
  border-radius: 30px;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  color: white;
  box-shadow: 0 10px 30px rgba(255,70,120,0.5);
}

button:hover {
  transform: scale(1.1);
}

/* Final message */
.final {
  position: absolute;
  inset: 0;
  background: rgba(255,240,245,0.9);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: 2s;
  color: #7a102a;
}

.final.show {
  opacity: 1;
}

.final h1 {
  font-size: 3.2rem;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="scene" id="scene">
  <!-- PERFECT SVG ROSE -->
  <svg class="rose" viewBox="0 0 200 300">
    <defs>
      <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9eb5"/>
        <stop offset="100%" stop-color="#b3002d"/>
      </radialGradient>
    </defs>

    <!-- Stem -->
    <rect x="95" y="130" width="10" height="160" fill="#145a32"/>

    <!-- Leaves -->
    <ellipse cx="70" cy="200" rx="35" ry="18" fill="#1e8449" transform="rotate(-20 70 200)"/>
    <ellipse cx="130" cy="230" rx="35" ry="18" fill="#1e8449" transform="rotate(20 130 230)"/>

    <!-- Rose head -->
    <path d="M100 40
             C60 60, 50 100, 100 120
             C150 100, 140 60, 100 40Z"
          fill="url(#petalGrad)"/>
  </svg>

  <!-- Ribbon -->
  <svg class="ribbon" viewBox="0 0 300 120">
    <path d="M20 60 Q150 20 280 60" fill="none" stroke="#c9184a" stroke-width="18"/>
    <g class="knot">
      <circle cx="150" cy="60" r="18" fill="#ff4d6d"/>
    </g>
  </svg>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this rose? 💌</div>

  <div class="buttons">
    <button onclick="acceptRose()">Yes, with love ❤️</button>
  </div>
</div>

<div class="final" id="final">
  <h1>You are my perfect rose 🌹</h1>
  <p>Wrapped with love, forever.</p>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/11/02/audio_5d8c1b5c75.mp3">
</audio>

<script>
/* Canvas petals with glow */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let petals = [];
let tiltX = 0;

class Petal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 6 + 8;
    this.vy = Math.random() * 1.2 + 0.4;
    this.vx = Math.random() * 0.6 - 0.3;
    this.rot = Math.random() * Math.PI;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowBlur = 20;
    ctx.shadowColor = "rgba(255,90,130,0.7)";
    ctx.fillStyle = "rgba(255,80,120,0.85)";
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  update() {
    this.y += this.vy;
    this.x += this.vx + tiltX * 0.4;
    this.rot += 0.02;
  }
}

/* Generate petals from rose */
setInterval(() => {
  petals.push(new Petal(innerWidth / 2, innerHeight / 2 - 120));
}, 350);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.y > canvas.height) petals.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

/* Mobile gyroscope */
window.addEventListener("deviceorientation", e => {
  tiltX = e.gamma / 30;
});

/* Accept */
function acceptRose() {
  document.getElementById("final").classList.add("show");
  document.getElementById("music").play();

  for (let i = 0; i < 50; i++) {
    petals.push(new Petal(innerWidth / 2, innerHeight / 2));
  }
}
</script>

</body>
</html>
