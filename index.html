<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day 🌹</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #ffdde1, #c9184a);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Scene */
.scene {
  position: relative;
  width: 400px;
  height: 520px;
  text-align: center;
}

/* Bouquet */
.bouquet {
  position: relative;
  height: 320px;
  margin-top: 40px;
}

.rose {
  position: absolute;
  font-size: 70px;
  bottom: 0;
  opacity: 0;
  transform: scale(0.3) translateY(40px);
  animation: bloom 1.8s ease forwards;
}

.rose:nth-child(1) { left: 45%; animation-delay: 0.5s; }
.rose:nth-child(2) { left: 30%; animation-delay: 1.2s; }
.rose:nth-child(3) { left: 60%; animation-delay: 1.9s; }
.rose:nth-child(4) { left: 20%; animation-delay: 2.6s; }
.rose:nth-child(5) { left: 70%; animation-delay: 3.3s; }

@keyframes bloom {
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Text */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #7a102a;
  margin-top: 20px;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 4.2s;
}

.question {
  margin-top: 15px;
  font-size: 1.2rem;
  color: #5a0f2e;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 5s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Buttons */
.buttons {
  margin-top: 20px;
  display: none;
}

button {
  padding: 10px 22px;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  margin: 0 8px;
}

.accept {
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  color: white;
}

.accept:hover {
  transform: scale(1.1);
}

.shy {
  background: white;
  color: #c9184a;
}

/* Final message */
.final {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  opacity: 0;
  pointer-events: none;
  transition: 1.5s;
}

.final.show {
  opacity: 1;
  pointer-events: auto;
}

.final h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 2.8rem;
  color: #c9184a;
}

.final p {
  margin-top: 10px;
  font-size: 1.1rem;
  color: #5a0f2e;
}

/* Floating petals */
.petal {
  position: absolute;
  font-size: 18px;
  animation: float 8s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from {
    transform: translateY(100vh) rotate(0deg);
    opacity: 0;
  }
  20% { opacity: 0.7; }
  to {
    transform: translateY(-20vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="bouquet">
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
  </div>

  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this bouquet? 💐</div>

  <div class="buttons" id="buttons">
    <button class="accept" onclick="acceptBouquet()">Yes 💖</button>
    <button class="shy">😊</button>
  </div>

  <div class="final" id="final">
    <h2>You made my day 🌹</h2>
    <p>This bouquet is filled with smiles and love ❤️</p>
  </div>

</div>

<!-- Soft background music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_8bfae3e5c6.mp3" type="audio/mpeg">
</audio>

<script>
/* Show buttons after text */
setTimeout(() => {
  document.getElementById('buttons').style.display = 'block';
}, 5500);

/* Accept interaction */
function acceptBouquet() {
  document.getElementById('final').classList.add('show');
  document.getElementById('music').play();
}

/* Floating petals */
function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'petal';
  petal.innerHTML = '🌸';
  petal.style.left = Math.random() * 100 + 'vw';
  petal.style.fontSize = Math.random() * 14 + 12 + 'px';
  petal.style.animationDuration = Math.random() * 5 + 6 + 's';
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 9000);
}

setInterval(createPetal, 450);
</script>

</body>
</html>
