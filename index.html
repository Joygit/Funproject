<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Serious Question 💖</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  h1 {
    color: #fff;
    margin-bottom: 30px;
  }

  button {
    padding: 12px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yes {
    background: #28a745;
    color: white;
  }

  #no {
    background: #dc3545;
    color: white;
    position: absolute;
  }

  #celebration {
    display: none;
    text-align: center;
    color: #fff;
  }
</style>
</head>

<body>

<h1>Babu will you go on a date on 14th Feb with me by being my valentine? </h1>

<div id="buttons">
  <button id="yes" onclick="celebrate()">Yes 😍</button>
  <button id="no" onmouseover="moveNo()">No 🙈</button>
</div>

<div id="celebration">
  <h1>🎉 Congratulations 🎉 </h1>
  <h2> You have my Heart ❤️ now </h2>
  <h3>Thank you for saying YES ❤️</h3>
</div>

<script>
function moveNo() {
  const noBtn = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

function celebrate() {
  document.getElementById("buttons").style.display = "none";
  document.querySelector("h1").style.display = "none";
  document.getElementById("celebration").style.display = "block";
}
</script>

</body>
</html>
