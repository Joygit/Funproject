<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day 🌹</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #2a0a16, #0a0306);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffe5ec;
  pointer-events: none;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.2rem;
  margin-top: 30px;
  color: #ffb3c6;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 2s;
}

.question {
  font-size: 1.2rem;
  margin-top: 10px;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 3s;
}

.buttons {
  margin-top: 20px;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 4s;
  pointer-events: auto;
}

button {
  padding: 10px 22px;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  margin: 0 8px;
}

.accept {
  background: linear-gradient(135deg, #ff4d6d, #c9184a);
  color: white;
}

.accept:hover {
  transform: scale(1.1);
}

.final {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(10px);
  color: #7a102a;
  font-size: 1.2rem;
  opacity: 0;
  transition: 2s;
  pointer-events: none;
}

.final.show {
  opacity: 1;
  pointer-events: auto;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="scene">
  <div style="font-size:120px;">🌹</div>
  <h1>Happy Rose Day</h1>
  <div class="question">Will you accept this rose? 💌</div>

  <div class="buttons">
    <button class="accept" onclick="acceptRose()">Yes 💖</button>
    <button>😊</button>
  </div>
</div>

<div class="final" id="final">
  <h1>You are my forever rose 🌹</h1>
  <p>This love gently falls… just for you ❤️</p>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_8bfae3e5c6.mp3">
</audio>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const petals = [];

class Petal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 6 + 6;
    this.speedY = Math.random() * 1.5 + 0.5;
    this.speedX = Math.random() * 1 - 0.5;
    this.rotation = Math.random() * Math.PI;
  }

  update() {
    this.y += this.speedY;
    this.x += this.speedX;
    this.rotation += 0.02;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = 'rgba(255,77,109,0.8)';
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* Create petals from rose */
setInterval(() => {
  petals.push(new Petal(canvas.width / 2, canvas.height / 2 - 80));
}, 400);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.y > canvas.height) petals.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

/* Accept */
function acceptRose() {
  document.getElementById('final').classList.add('show');
  document.getElementById('music').play();

  // Petal shower
  for (let i = 0; i < 40; i++) {
    petals.push(new Petal(
      canvas.width / 2 + Math.random() * 100 - 50,
      canvas.height / 2
    ));
  }
}
</script>

</body>
</html>
